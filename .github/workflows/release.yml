# Every push to master/main: test, build the Windows installer, and publish it as a GitHub release
# with an incrementing version (major.minor from package.json, patch = workflow run number).
name: Build and release

on:
  push:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: write # create tags and releases

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false # never cancel a half-published release

env:
  CSC_IDENTITY_AUTO_DISCOVERY: 'false' # no code-signing certificate in CI
  # Electron / electron-builder downloads (Electron zip, NSIS, icon tools). Their default folders, outside the repo
  # on purpose: inside it, the extracted helper scripts inherit this package's "type": "module" and crash.
  ELECTRON_CACHE_PATHS: |
    ~\AppData\Local\electron\Cache
    ~\AppData\Local\electron-builder\Cache

jobs:
  release:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm # ~/.npm, keyed on package-lock.json

      # Restore and save are separate steps so a cache is kept even when a later step (tests) fails.
      # node_modules includes the Electron binary its postinstall downloads: a hit skips `npm ci` entirely.
      - name: Restore node_modules
        id: modules
        uses: actions/cache/restore@v6
        with:
          path: node_modules
          key: modules-v2-${{ runner.os }}-node24-${{ hashFiles('package-lock.json') }} # v2: v1 was saved without the Electron binary

      - name: Restore Electron downloads
        id: electron
        uses: actions/cache/restore@v6
        with:
          path: ${{ env.ELECTRON_CACHE_PATHS }}
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-

      - name: Install dependencies
        if: steps.modules.outputs.cache-hit != 'true'
        run: npm ci

      # npm 11 on the runner skips install scripts, so Electron's postinstall never fetched electron.exe
      # (the MCP smoke test then failed with "cannot find the path"). Run its installer explicitly:
      # a no-op (~0.3 s) when the binary is there, and it uses the restored Electron download cache.
      - name: Ensure Electron binary
        run: |
          node node_modules/electron/install.js
          if (-not (Test-Path node_modules/electron/dist/electron.exe)) { throw 'electron.exe is still missing' }

      - name: Save node_modules
        if: steps.modules.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: node_modules
          key: ${{ steps.modules.outputs.cache-primary-key }}

      - name: Set version
        id: version
        run: |
          $parts = (node -p "require('./package.json').version").Split('.')
          $version = "$($parts[0]).$($parts[1]).${{ github.run_number }}"
          npm version $version --no-git-tag-version --allow-same-version | Out-Null
          "version=$version" >> $env:GITHUB_OUTPUT
          "Building version $version"

      - name: Typecheck
        run: npm run typecheck

      # Before the tests: they check that the built runner (dist/cli/run.js) exists.
      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Build installer
        run: |
          npx electron-builder --win --publish never
          Get-ChildItem dist-installer -Filter *.exe | ForEach-Object { "$($_.Name)  $([math]::Round($_.Length / 1MB, 1)) MB" }

      - name: Save Electron downloads
        if: always() && steps.electron.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ env.ELECTRON_CACHE_PATHS }}
          key: ${{ steps.electron.outputs.cache-primary-key }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: SSH-Resource-Manager-${{ steps.version.outputs.version }}
          path: dist-installer/*Setup*.exe
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: SSH Resource Manager ${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          body: |
            Windows installer built from ${{ github.sha }}.

            ${{ github.event.head_commit.message }}
          files: dist-installer/*Setup*.exe
          fail_on_unmatched_files: true

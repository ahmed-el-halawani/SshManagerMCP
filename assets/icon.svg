<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="screen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#111c33"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="16" y="16" width="480" height="480" rx="104" fill="url(#bg)"/>
  <!-- terminal window -->
  <rect x="76" y="104" width="360" height="256" rx="36" fill="url(#screen)" stroke="#7dd3fc" stroke-opacity=".35" stroke-width="6"/>
  <circle cx="116" cy="140" r="10" fill="#f87171"/>
  <circle cx="148" cy="140" r="10" fill="#fbbf24"/>
  <circle cx="180" cy="140" r="10" fill="#34d399"/>
  <!-- >_ prompt -->
  <path d="M130 210 L188 248 L130 286" fill="none" stroke="#e0f2fe" stroke-width="26" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="210" y="272" width="96" height="24" rx="12" fill="#38bdf8"/>
  <!-- link to remote hosts -->
  <path d="M256 360 V400 M160 420 H352" stroke="#e0f2fe" stroke-width="16" stroke-linecap="round"/>
  <circle cx="160" cy="420" r="26" fill="#e0f2fe"/>
  <circle cx="256" cy="420" r="26" fill="#38bdf8"/>
  <circle cx="352" cy="420" r="26" fill="#e0f2fe"/>
</svg>
